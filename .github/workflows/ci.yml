name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Package tests & daemon smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        working-directory: TrameCore
        run: swift test
      - name: Daemon smoke test
        working-directory: TrameCore
        run: |
          swift build
          .build/debug/trame-smoke

  app:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build Trame.app
        run: |
          xcodebuild -project Trame.xcodeproj -scheme Trame -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
